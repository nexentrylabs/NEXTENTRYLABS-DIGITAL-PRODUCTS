<style>
:root{--bg:#f4f6f9;--fg:#11151c;--mut:#566070;--card:#fff;--line:#dce1e9;--ac:#0a7cff;--on:#fff;--e:cubic-bezier(.2,.8,.2,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0d13;--fg:#e8ecf3;--mut:#97a1b2;--card:#131822;--line:#252d3b;--ac:#38a8ff}}
:root[data-theme="dark"]{--bg:#0a0d13;--fg:#e8ecf3;--mut:#97a1b2;--card:#131822;--line:#252d3b;--ac:#38a8ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 Sora,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
button,input{font:inherit}a{color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:8px 16px}
header .b{display:flex;gap:10px;align-items:center;font-weight:800;cursor:pointer;background:none;border:0;color:var(--fg);padding:0}
header img{width:38px;height:38px;border-radius:50%}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
nav button[aria-current=true]{background:var(--fg);color:var(--bg)}
.w{max-width:1040px;margin:0 auto;padding:0 18px}
.hero img{width:100%;border-radius:14px;display:block;margin-top:20px}
h1{font-size:clamp(28px,5vw,46px);line-height:1.12;margin:.5em 0 .3em;font-weight:800}
h2{font-size:clamp(21px,3vw,28px);margin:0 0 .5em}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin:28px 0}
.pc{border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.pc h3{margin:0;font-size:21px}.pc p{margin:0}.pc .pr{font-size:30px;font-weight:800}
.pc button,.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;cursor:pointer;margin-top:auto;font-size:15px}
footer{padding:30px 18px;text-align:center;color:var(--mut);font-size:14px}
/* product shells */
.p{padding:34px 0 60px}.p .w{display:block}
.p section{margin:38px 0}
.p .btn{background:var(--ac);color:var(--on)}
.p input[type=email],.p input[type=text]{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.p input[type=file]{width:100%;padding:10px;border:1px dashed var(--ac);border-radius:8px;background:var(--card);color:var(--fg)}
.chip{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--ac);color:var(--on);font-weight:700;font-size:14px}
.steps{counter-reset:s;list-style:none;padding:0;display:grid;gap:12px}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px 14px 56px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:14px;top:12px;width:30px;height:30px;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center;font-weight:800}
.steps b{display:block}.m{color:var(--mut);font-size:14px}
.demo{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.demo pre{white-space:pre-wrap;margin:12px 0;padding:12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);font:13.5px/1.55 inherit}
.co{background:var(--card);border:2px solid var(--ac);border-radius:16px;padding:22px;display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:24px}
.co img{width:100%;border-radius:12px;background:#fff}
.co label{display:block;font-weight:700;margin:14px 0 6px}
@media(max-width:700px){.co{grid-template-columns:1fr}}
.ok{margin-top:16px;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--ac)}.er{color:#e5484d;font-weight:600;margin-top:8px}
/* P1 stocks */
.p1{--bg:#071423;--fg:#e4f0ff;--mut:#8fa8c4;--card:#0d2036;--line:#18364f;--ac:#2dd4bf;--on:#042a26;background:var(--bg);color:var(--fg)}
.p1 h1,.p1 h2{letter-spacing:-.02em}.p1 .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
.p1 details{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:10px;padding:12px 16px}
.p1 summary{cursor:pointer;font-weight:600}.p1 details p{margin:.6em 0 0;color:var(--mut);font-size:15px}
.p1 .hero2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center}@media(max-width:700px){.p1 .hero2{grid-template-columns:1fr}}
/* P2 options */
.p2{--bg:#14111a;--fg:#f3eee6;--mut:#a79fb3;--card:#1d1926;--line:#342d43;--ac:#ffb21f;--on:#2b1d00;background:var(--bg);color:var(--fg);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.p2 h1,.p2 h2{font-family:"JetBrains Mono",monospace;letter-spacing:-.03em}
.ch{width:100%;border-collapse:collapse;font-size:14px}.ch th{color:var(--mut);font-weight:400;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.ch td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}.ch tr.r{cursor:pointer}.ch tr.r:hover td{background:var(--card)}
.ch .k{background:var(--card);color:var(--ac);font-weight:700;text-align:center;white-space:nowrap}.ch .d td{color:var(--mut);background:#100d16}
.cl{color:#4ade80}.pt{color:#fb7185}
.bar{display:inline-block;height:8px;border-radius:2px;vertical-align:middle}
/* P3 solo */
.p3{--bg:#e9f1ec;--fg:#13261c;--mut:#4a6154;--card:#fff;--line:#c5d6cb;--ac:#13261c;--on:#f4d35e;--hl:#f4d35e;background:var(--bg);color:var(--fg)}
.p3 h1,.p3 h2{font-family:Fraunces,Georgia,serif;font-weight:700}.p3 h1{font-size:clamp(32px,5.5vw,54px)}
.p3 .tl{display:grid;grid-template-columns:230px 1fr;gap:18px}@media(max-width:700px){.p3 .tl{grid-template-columns:1fr}}
.tabs{display:flex;flex-direction:column;gap:6px}@media(max-width:700px){.tabs{flex-direction:row;overflow-x:auto}}
.tabs button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--fg);white-space:nowrap}
.tabs button[aria-selected=true]{background:var(--fg);color:var(--hl);border-color:var(--fg)}
.pn{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}.pn h3{font-family:Fraunces,Georgia,serif;font-size:24px;margin:0 0 4px}
.pn ol{padding-left:20px}.pn li{margin:8px 0}.hl{background:var(--hl);padding:0 6px}
.p3 .p3x{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.p3x span{background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:6px;font-size:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(26px,-34px,0)}}
@keyframes mq{to{transform:translateX(-50%)}}@keyframes dr{to{stroke-dashoffset:0}}@keyframes gr{from{transform:scaleX(0)}}
@keyframes pop{0%{opacity:0;transform:scale(.8)}60%{transform:scale(1.06)}to{opacity:1;transform:none}}
@keyframes bl{50%{opacity:0}}@keyframes pu{50%{transform:scale(1.9);opacity:.35}}@keyframes sw{to{background-size:100% 100%}}
@keyframes cf{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}@keyframes glow{50%{box-shadow:0 0 0 9px rgba(127,127,127,.13)}}
#v>*{animation:up .6s var(--e) both}
.sp{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#2dd4bf,#0a7cff,#ffb21f);z-index:20}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s var(--e),transform .7s var(--e);transition-delay:var(--dl,0ms)}.rv.in{opacity:1;transform:none}
.hh{position:relative;padding:44px 0 6px;isolation:isolate}.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38;z-index:-1;animation:fl 12s ease-in-out infinite}
.o1{width:300px;height:300px;background:#0a7cff;top:-50px;left:-60px}.o2{width:260px;height:260px;background:#2dd4bf;right:-30px;top:60px;animation-delay:-4s}.o3{width:220px;height:220px;background:#ffb21f;bottom:-50px;left:42%;animation-delay:-8s}
.hh h1{font-family:Unbounded,Sora,sans-serif;font-weight:800;font-size:clamp(26px,5vw,50px);letter-spacing:-.03em;max-width:860px}
.split span{display:inline-block;animation:up .8s var(--e) var(--d) both}
.bn{animation:fl 9s ease-in-out infinite;box-shadow:0 30px 80px -20px rgba(10,124,255,.45)}
.mq{overflow:hidden;border-block:1px solid var(--line);margin:28px 0;white-space:nowrap}.mq div{display:inline-block;padding:12px 0;animation:mq 30s linear infinite}.mq span{margin:0 24px;font-weight:700;color:var(--mut)}.mq:hover div{animation-play-state:paused}
.pc{position:relative;overflow:hidden;transition:transform .45s var(--e),box-shadow .45s var(--e)}.pc:hover{transform:translateY(-10px) rotate(-.5deg);box-shadow:0 28px 60px -22px rgba(0,0,0,.5)}
.pc::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.2),transparent 60%)}.pc:hover::after{opacity:1}
.pc button{transition:transform .25s var(--e),filter .25s}.pc button:hover{transform:scale(1.04);filter:brightness(1.1)}
.btn{position:relative;overflow:hidden;transition:transform .25s var(--e),filter .25s}.btn:hover{transform:translateY(-2px) scale(1.03);filter:brightness(1.1)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%)}.btn:hover::after{transform:translateX(120%);transition:transform .7s}
nav button{transition:transform .25s var(--e),background .25s}nav button:hover{transform:translateY(-2px)}
.bs{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-bottom:10px}
.p1,.p2,.p3{transition:background .4s}
.p1{background:radial-gradient(900px 420px at 88% -4%,#0e3a4a,transparent),var(--bg)}
.p1 h1,.p1 h2{font-family:Unbounded,Sora,sans-serif;font-weight:700;letter-spacing:-.04em}
.st{display:flex;gap:34px;flex-wrap:wrap;margin:24px 0 4px}.st b{display:block;font:800 40px/1.1 Unbounded,Sora,sans-serif;color:var(--ac)}.st span{font-size:13px;color:var(--mut)}
.p1 svg .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.2s .4s var(--e) forwards}.p1 svg circle{transform-box:fill-box;transform-origin:center;animation:pu 1.8s 2.4s infinite}
.p1 details{transition:background .3s,transform .35s var(--e),border-color .3s}.p1 details:hover{transform:translateX(5px);background:#10294a}.p1 details[open]{border-left-width:8px}.p1 details[open] p{animation:up .4s var(--e)}
.p2{background:linear-gradient(rgba(255,178,31,.05) 1px,transparent 1px) 0 0/100% 34px,var(--bg)}
.p2 h1,.p2 h2{font-family:"Space Mono","JetBrains Mono",monospace;font-weight:700}.p2 h1::after{content:"▌";color:var(--ac);margin-left:4px;animation:bl 1s steps(1) infinite}
.bar{transform-origin:left;animation:gr 1.2s .3s var(--e) both}.ch tr.r td{transition:background .25s}.ch .d td{animation:up .35s var(--e)}
.p3{background:radial-gradient(720px 380px at 8% 0,#f9efb8,transparent),var(--bg)}
.p3 h1,.p3 h2{font-family:Fraunces,Georgia,serif;font-weight:800;letter-spacing:-.02em}
.p3x span{opacity:0;animation:pop .6s var(--e) calc(var(--i,0)*120ms + 300ms) both}
.tlb{height:6px;background:var(--line);border-radius:9px;margin:4px 0 8px;overflow:hidden}.tlb i{display:block;height:100%;background:var(--ac);transform-origin:left;animation:gr 2.2s .5s var(--e) both}
.tabs button{transition:transform .25s var(--e),background .25s,color .25s}.tabs button:hover{transform:translateX(5px)}.pn{animation:up .4s var(--e)}
.hl{background:linear-gradient(var(--hl),var(--hl)) 0 100%/0 100% no-repeat;animation:sw .8s .4s var(--e) forwards}
.co{animation:glow 3.4s ease-in-out infinite}.co img{transition:transform .5s var(--e);box-shadow:0 14px 40px -14px rgba(0,0,0,.5)}.co img:hover{transform:scale(1.04) rotate(-1deg)}
.steps li{transition:transform .3s var(--e),border-color .3s}.steps li:hover{transform:translateY(-3px);border-color:var(--ac)}
.p input{transition:border-color .25s,box-shadow .25s}.p input:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}
.ok{animation:pop .6s var(--e)}.ck{width:56px;height:56px}.ck circle,.ck path{fill:none;stroke:var(--ac);stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:dr .7s .1s forwards}.ck path{animation-delay:.6s}
.cf{position:fixed;width:9px;height:14px;z-index:30;pointer-events:none;animation:cf 1.3s var(--e) forwards}
@media(prefers-reduced-motion:reduce){.rv,.p3x span{opacity:1!important;transform:none!important}.ln,.ck circle,.ck path{stroke-dashoffset:0!important}.hl{background-size:100% 100%!important}}

/* NextentryLabs free innovation layer */
:root{scroll-behavior:smooth} .top-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top-tools button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:13px}
.lab-home{margin:34px auto 12px;padding:26px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,var(--card),var(--bg));box-shadow:0 18px 50px #0000000b}.lab-home .lab-eyebrow{font:700 12px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--ac)}
.lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:18px}.lab-card{border:1px solid var(--line);background:var(--card);border-radius:15px;padding:18px;min-width:0}.lab-card h3{margin:0 0 8px}.lab-card p{color:var(--mut);font-size:14px}.lab-card .tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:11px;color:var(--mut);margin-bottom:9px}
.lab-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:15px 0}.lab-form label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.lab-form input,.lab-form select,.lab-form textarea,.finder-input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:11px;font:inherit}.lab-form textarea{min-height:110px;resize:vertical}.lab-output{width:100%;min-height:180px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font:13px/1.65 'JetBrains Mono',monospace}.lab-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.lab-actions button,.lab-btn{border:0;border-radius:9px;background:var(--ac);color:var(--on);font-weight:700;padding:10px 14px;cursor:pointer}.lab-actions .secondary{background:var(--card);color:var(--fg);border:1px solid var(--line)}.finder-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}.finder-input{flex:1;min-width:190px}.trust-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}.trust-grid div{padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:13px}.trust-grid b{display:block;font-size:15px;margin-bottom:3px}.notice{border-left:4px solid #f59e0b;background:var(--bg);padding:13px 15px;border-radius:8px;color:var(--mut);font-size:13px;margin:14px 0}.lab-home details{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}.lab-home summary{cursor:pointer;font-weight:700}.small-muted{font-size:12px;color:var(--mut)}
@media(max-width:650px){header{padding:8px 10px}.top-tools{width:100%;margin-left:0}.lab-home{padding:17px}.lab-home h2{font-size:22px}}

['Fundamental Analysis','11–20','Read income statements, balance sheets, cash flow, ROE/ROCE, debt, earnings quality, shareholding and management, one lens at a time.'],
['Valuation & Fair Value','21–30','P/E, PEG, EV/EBITDA, P/B, DCF, reverse DCF and margin of safety, always as ranges with stated assumptions.'],

['Risk Management','61–70','Bear, base and bull cases, scenario matrix, thesis-break signals, permanent-loss risk and a position-size framework.'],
['News & Market Research','71–80','Turn news, results, earnings calls and annual reports into structured notes, and verify claims against primary sources.'],
['IPO & Corporate Actions','81–90','IPO red flags, valuation vs peers, rights issues, buybacks, splits, bonuses, demergers and mergers.'],

['Risk, Margin & Position Management','31–40','Position risk profile, sizing from maximum loss, margin planning, stop-loss and adjustment rules, gap stress tests, costs and charges.'],
['Events, Expiry & Trade Review','41–50','Expiry-day brief, event and results IV-crush planning, stock-option rule checks, trade journal, mistake classifier and backtest plan.']];

<div><h2>Get it now · ${inr(p.p)}</h2><ol class="steps" style="margin:0 0 6px"><li><b>Pay ${inr(p.p)}</b>Scan the QR with any UPI app.</li><li><b>Enter your email</b>Your product is sent to this address.</li><li><b>Send your order email</b>Attach your payment screenshot to the email. We check the payment and send your files to your inbox.</li></ol>

<div id="er" class="er" role="alert"></div><button class="btn" style="margin-top:14px" onclick="sub('${k}')">Send order email</button><div id="out"></div></div></section>`}

if(!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(e))return er.textContent='Please enter a valid email address.';

const mail='mailto:nextentrylabs@gmail.com?subject='+encodeURIComponent('Order: '+p.t)+'&body='+encodeURIComponent(body);
$('#out').innerHTML=`<div class="ok"><b>Your order email is ready.</b><p class="m">Tap the button, attach your payment screenshot and send. We will check your payment and email <b>${p.t}</b> to ${safe}.</p><a class="btn" style="text-decoration:none;display:inline-block" href="${mail}">Open order email</a><p class="m">Email app did not open? Send your payment screenshot and email address to nextentrylabs@gmail.com or message @next_entrylabs on Instagram.</p></div>`}
function demo(a,b,txt,f1,f2){return `<div class="demo"><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px"><div><label class="m" for="d1">${f1}</label><input id="d1" type="text" value="${a}" oninput="dm()"></div>${f2?`<div><label class="m" for="d2">${f2}</label><input id="d2" type="text" value="${b}" oninput="dm()"></div>`:''}</div><pre id="dp" data-t="${txt}"></pre><button class="btn" style="margin:0" onclick="navigator.clipboard&&navigator.clipboard.writeText($('#dp').textContent)">Copy prompt</button></div>`}

function boom(){const r=$('#out').getBoundingClientRect(),c=['#2dd4bf','#ffb21f','#0a7cff','#f4d35e','#fb7185'];for(let i=0;i<28;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${r.left+r.width/2}px;top:${r.top+20}px;background:${c[i%5]};--x:${(Math.random()-.5)*380}px;--y:${Math.random()*260+40}px;--r:${Math.random()*540}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}

<div class="lab-grid"><article class="lab-card"><span class="tag">TOOL 01</span><h3>Prompt Studio</h3><p>Build a more specific prompt for research or analysis. Copy it into your preferred AI chat.</p><div class="lab-form"><div><label for="ps-task">What do you want to do?</label><select id="ps-task"><option value="stock">Analyse an Indian stock</option><option value="technical">Analyse a chart / technical setup</option><option value="option">Analyse an option chain</option><option value="business">Create a business plan</option><option value="research">Research a topic</option></select></div><div><label for="ps-name">Company / instrument / topic</label><input id="ps-name" placeholder="e.g. Reliance Industries / NIFTY"></div><div><label for="ps-data">Data you will provide</label><input id="ps-data" placeholder="e.g. dated results, chart, option chain"></div><div><label for="ps-lang">Answer language</label><select id="ps-lang"><option>Simple English</option><option>Marathi</option><option>Hindi</option><option>English + Marathi terms</option></select></div></div><div class="lab-actions"><button onclick="buildPrompt()">Build my prompt</button><button class="secondary" onclick="copyText('prompt-output')">Copy prompt</button><button class="secondary" onclick="downloadText('prompt-output','NextentryLabs_Custom_Prompt.txt')">Download .txt</button></div><pre class="lab-output" id="prompt-output" aria-live="polite">Choose a task and click “Build my prompt”.</pre></article>

function filterProducts(){const q=($('#product-search')?.value||'').toLowerCase().trim(),kind=$('#product-kind')?.value||'all';let n=0;document.querySelectorAll('#finder-cards .lab-card').forEach(c=>{const show=(kind==='all'||c.dataset.kind===kind)&&c.textContent.toLowerCase().includes(q);c.hidden=!show;if(show)n++});const r=$('#finder-result');if(r)r.textContent=n+' matching product'+(n===1?'':'s')}
function buildPrompt(){const task=$('#ps-task').value,name=$('#ps-name').value.trim()||'[ENTER NAME]',data=$('#ps-data').value.trim()||'[PASTE YOUR DATED DATA OR DESCRIBE THE INPUTS]',lang=$('#ps-lang').value;let body='';const common=`Answer in ${lang}. Work only from the data I provide and clearly separate verified facts, calculations, interpretation and uncertainty. Do not invent live prices, figures, citations or missing data. If something essential is missing, ask for it. State the data date, assumptions and limitations. End with a concise checklist of what I should independently verify.`;
if(task==='stock')body=`Act as a careful equity research assistant. Analyse ${name}. Data I will provide: ${data}. Review business model, revenue/profit trends, balance-sheet strength, cash flow, ROE/ROCE, valuation drivers, key risks and relevant questions for further research. Use a table for facts and a separate section for interpretation. Do not give a guaranteed target price or personalized buy/sell instruction. ${common}`;
else if(task==='technical')body=`Act as a technical-analysis assistant. Review ${name} using the following chart/market inputs: ${data}. Identify the visible trend, market structure, support/resistance zones, volume context and indicator conflicts only where the supplied data supports them. Give bullish, bearish and neutral scenarios, invalidation conditions, and what is not knowable from the input. Do not invent prices or guarantee outcomes. ${common}`;
else if(task==='option')body=`Act as an options data-analysis assistant for ${name}. I will provide: ${data}. Summarize the supplied option-chain/OI/IV/Greeks data, highlight calculations that can be checked, explain possible interpretations and list missing inputs such as timestamp, expiry, lot size and underlying price. Do not invent live NSE data or recommend a trade as certain. Show risk and max-loss assumptions for any example. ${common}`;
else if(task==='business')body=`Act as a practical small-business strategist. Help me build a testable plan for ${name}. Inputs: ${data}. Provide target customer, customer problem, offer, deliverables, pricing assumptions, acquisition channels, costs, risks, a 7-day validation plan and measurable success criteria. Mark assumptions clearly and avoid claiming market demand without evidence. ${common}`;
else body=`Act as a careful research assistant investigating ${name}. Research question and supplied material: ${data}. First define the question, then identify what evidence is needed, evaluate source quality, separate known facts from assumptions, summarize competing explanations and propose next steps. Do not fabricate sources or quotations. ${common}`;
$('#prompt-output').textContent=body}
function buildBusinessCopy(){const type=$('#bc-type').value,business=$('#bc-business').value.trim()||'[your service]',client=$('#bc-client').value.trim()||'[client / audience]',benefit=$('#bc-benefit').value.trim()||'[main benefit]',notes=$('#bc-notes').value.trim()||'[scope, deliverables, timeline and next step]';let t='';
if(type==='email')t=`Subject: A practical way to improve ${benefit.toLowerCase()}\n\nHello ${client},\n\nI’m reaching out because I help with ${business}. The goal is to ${benefit}.\n\nA possible starting point: ${notes}. If this is relevant to your team, I can send a short example or discuss the scope before proposing a final price.\n\nWould a brief conversation next week be useful?\n\nRegards,\nNextentryLabs`;
else if(type==='proposal')t=`SERVICE PROPOSAL\n\nPrepared for: ${client}\nService: ${business}\n\nOBJECTIVE\n${benefit}.\n\nPROPOSED SCOPE\n${notes}\n\nDELIVERABLES\n• Confirmed scope and acceptance criteria\n• Agreed delivery format and timeline\n• One review round, if agreed before work starts\n\nCOMMERCIALS\nPrice, taxes, payment schedule and validity should be confirmed in writing before work begins.\n\nNEXT STEP\nConfirm the scope, timeline and success criteria so a final proposal can be prepared.`;
else if(type==='followup')t=`Subject: Follow-up on ${business}\n\nHello ${client},\n\nI’m following up regarding ${business}. The agreed next step was: ${notes}.\n\nCould you please share an update or let me know if anything is needed from my side? If payment is pending, please confirm the expected processing date and reference once available.\n\nThank you,\nNextentryLabs`;
else t=`${business}\n\nDesigned for: ${client}\n\nWhat it helps with: ${benefit}.\n\nWhat is included:\n${notes}\n\nBest for teams that want a clear, practical starting point without unnecessary complexity. Please confirm the exact scope, compatibility and delivery details before purchase.`;
$('#business-output').textContent=t}
async function copyText(id){const el=document.getElementById(id),txt=el?.textContent||'';try{await navigator.clipboard.writeText(txt);alert('Copied to clipboard.')}catch(e){const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);alert('Clipboard permission was blocked. Text is selected; press Ctrl+C.')}}
function downloadText(id,name){const text=document.getElementById(id)?.textContent||'';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
addEventListener('hashchange',render);render();
